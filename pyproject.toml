[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmail-second-account-mcp"
version = "1.0.1"
description = "MCP server for a single Gmail mailbox, with an OAuth 2.1 login for Claude.ai"
readme = "README.md"
license = "MIT"
requires-python = ">=3.12"
keywords = ["gmail", "mcp", "email", "oauth", "model-context-protocol"]

dependencies = [
    # <2 until the MCPServer migration: 2.x moved mcp.server.fastmcp
    "mcp>=1.29.0,<2",
    "httpx>=0.27.0",
]

[project.scripts]
gmail-mcp = "gmail_mcp.server:main"

[dependency-groups]
dev = ["pytest>=8.0.0", "ruff>=0.8.0"]

[tool.hatch.build.targets.wheel]
packages = ["src/gmail_mcp"]

[tool.ruff]
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
# Tools hand every failure back as a structured error string; an exception
# escaping into the stdio stream kills the session.
"src/gmail_mcp/server.py" = ["BLE001"]
